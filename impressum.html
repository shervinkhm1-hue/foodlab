    h1 { font-size: 40px; margin: 0 0 24px; }
    h2 { font-size: 22px; margin: 32px 0 8px; }
    p { margin: 0 0 12px; }
    .source { color: var(--muted); font-size: 14px; margin-top: 32px; }
    .back { display: inline-block; margin-top: 24px; font-weight: 600; }
